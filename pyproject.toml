[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"


[project]
name = "geradorabntpy"
dynamic = ["version"]
description = "Gerador de referências ABNT a partir de URLs"
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "lxml>=5.0", 
    "requests>=2.31",
    "citeproc-py>=0.6",
    "beautifulsoup4>=4.12",
]

[tool.setuptools]
packages = ["geradorabnt"]

[tool.setuptools.package-data]
"*" = ["*.csl"]